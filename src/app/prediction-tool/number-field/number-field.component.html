<div class="nf-group" [class.nf-focused]="focused()" role="group" [attr.aria-label]="ariaLabel() || null">
  <button type="button" tabindex="-1" class="nf-stepper"
    [class.nf-stepper-disabled]="atMin()"
    [disabled]="atMin() || disabled()"
    [attr.aria-label]="decreaseLabel()"
    [title]="decreaseLabel()"
    (pointerdown)="startHold($event, 'dec')"
    (pointerup)="stopHold()"
    (pointerleave)="stopHold()"
    (pointercancel)="stopHold()">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <input #inputEl
    [id]="inputId()"
    type="text"
    inputmode="numeric"
    role="spinbutton"
    [attr.aria-valuemin]="minValue()"
    [attr.aria-valuemax]="maxValue()"
    [attr.aria-valuenow]="numericValue()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-describedby]="ariaDescribedby()"
    [attr.aria-required]="required() || null"
    [value]="displayValue()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (keydown)="onKeyDown($event)"
    (focus)="focused.set(true)"
    (blur)="onBlur()"
    class="nf-input"
    autocomplete="off"
  />
  @if (unit()) {
    <span class="nf-unit" aria-hidden="true">{{ unit() }}</span>
  }
  <button type="button" tabindex="-1" class="nf-stepper"
    [class.nf-stepper-disabled]="atMax()"
    [disabled]="atMax() || disabled()"
    [attr.aria-label]="increaseLabel()"
    [title]="increaseLabel()"
    (pointerdown)="startHold($event, 'inc')"
    (pointerup)="stopHold()"
    (pointerleave)="stopHold()"
    (pointercancel)="stopHold()">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
</div>
