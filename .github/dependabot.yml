version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `root` directory
    directory: "/"
    # Check the npm registry for updates monthly
    schedule:
      interval: "monthly"
    groups:
      angular:
        # Angular pins a narrow TypeScript peer range (e.g. @angular/compiler-cli@22
        # requires typescript >=6.0 <6.1), so TypeScript and tslib must be bumped in
        # the same PR as @angular/* — otherwise an Angular-major PR fails `npm ci` on
        # the peer conflict and a lone TypeScript PR is unmergeable on its own.
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'typescript'
          - 'tslib'
      types:
        patterns:
          - '@types/*'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@playwright/*'
      charting:
        patterns:
          - 'chart.js'
          - 'ng2-charts'
      cloudflare:
        patterns:
          - '@cloudflare/*'
          - 'wrangler'
      miscellaneous:
        patterns:
          - '*'
