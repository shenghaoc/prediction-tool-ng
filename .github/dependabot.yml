version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `root` directory
    directory: "/"
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: "monthly"
    groups:
      angular:
        patterns:
          - '@angular/*'
        update-types:
          - 'minor'
          - 'patch'
      typescript:
        patterns:
          - 'typescript'
          - 'tslib'
          - '@types/*'
        update-types:
          - 'minor'
          - 'patch'
      testing:
        patterns:
          - 'jasmine-core'
          - 'karma'
          - 'karma-*'
        update-types:
          - 'minor'
          - 'patch'
      charting:
        patterns:
          - 'chart.js'
          - 'ng2-charts'
        update-types:
          - 'minor'
          - 'patch'
      cloudflare:
        patterns:
          - '@cloudflare/*'
          - 'wrangler'
        update-types:
          - 'minor'
          - 'patch'
      miscellaneous:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
